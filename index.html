<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Restaurants</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Finnish Student Restaurants</h1>
        <div id="auth-section">
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <input type="email" id="email" placeholder="Email (Registration)">
                <button type="submit">Login</button>
                <button type="button" id="register-btn"
                    style="background-color: #3498db; color: white; border: none; padding: 0.5rem; border-radius: 4px; cursor: pointer; font-weight: bold;">Register</button>
            </form>
            <p id="auth-message"></p>
        </div>
        <div id="user-info" class="hidden">
            <span id="welcome-text"></span>
            <button id="logout-btn">Logout</button>
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <h2>Locations</h2>
            <ul id="restaurant-list"></ul>
        </aside>
        <main class="content">
            <div id="menu-controls" class="hidden">
                <h2 id="restaurant-name-title"></h2>
                <div class="buttons">
                    <button id="btn-daily" class="active">Daily Menu</button>
                    <button id="btn-weekly">Weekly Menu</button>
                    <button id="favorite-btn"
                        style="background-color: #f1c40f; color: #333; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; display: none;">★
                        Favorite</button>
                </div>
            </div>
    </div>
    <div id="menu-display">
        <p>Select a restaurant from the sidebar to view its menu.</p>
    </div>
    </main>
    </div>
    <script src="main.js"></script>
</body>

</html>
